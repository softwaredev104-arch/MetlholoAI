name: Build Expo Web

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: metlholoai-web-dist
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --legacy-peer-deps
      - run: npx expo install --fix
      - run: npm run build:web

      - uses: actions/upload-artifact@v4
        with:
          name: metlholoai-web-dist
          path: dist
          if-no-files-found: error
          retention-days: 3

      - name: Publish compiled web branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: web-dist
          force_orphan: true

      # The Cloudflare Worker preview serves the compiled web-dist branch.
      # Direct Pages deployment can be re-enabled once account-scoped
      # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are configured.
