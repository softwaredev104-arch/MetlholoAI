name: Quality

on:
  push:
    branches: [main, foundation/metlholoai-react-native, feat/agricultural-knowledge-layer]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci
