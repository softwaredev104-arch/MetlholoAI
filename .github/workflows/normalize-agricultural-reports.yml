name: Normalize Agricultural Report Runtime

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - foundation/metlholoai-react-native

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Normalize CommonJS report handlers
        shell: bash
        run: |
          set -euo pipefail
          find services/agricultural-intelligence -name 'generate-report.js' -type f -print0 |
            xargs -0 -r sed -i 's/^export default async function handler/module.exports = async function handler/'
      - name: Commit normalized reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/agricultural-intelligence
          git diff --cached --quiet && exit 0
          git commit -m "fix(phase6): normalize agricultural report handlers"
          git push origin HEAD:${{ github.head_ref }}
