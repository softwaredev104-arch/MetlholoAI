name: Repair Agricultural Dependencies

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - foundation/metlholoai-react-native

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Regenerate service lockfiles
        shell: bash
        run: |
          set -euo pipefail
          for service in general maize grape apple potatoes pepper tomato spinach poultry; do
            cd "services/agricultural-intelligence/$service"
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            cd - >/dev/null
          done
      - name: Commit lockfiles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/agricultural-intelligence/*/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(phase6): synchronize agricultural dependency lockfiles"
          git push origin HEAD:${{ github.head_ref }}
