name: Import Apple Intelligence Foundation

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - foundation/metlholoai-react-native

permissions:
  contents: write

jobs:
  import-apple:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: softwaredev104-arch/MetlholoAI
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Apple source foundation
        uses: actions/checkout@v4
        with:
          repository: loetolex/Botswana-Agricultural-Intelligence-Platform-Apple
          ref: main
          path: apple-source

      - name: Import foundation into primary repository
        run: |
          set -euo pipefail
          target="services/agricultural-intelligence/apple"
          if [ -d "$target" ]; then
            echo "Apple foundation already imported; no-op."
            exit 0
          fi
          mkdir -p "$target"
          cp -R apple-source/api "$target/api"
          cp -R apple-source/models "$target/models"
          cp apple-source/package.json "$target/package.json"
          if [ -f apple-source/package-lock.json ]; then cp apple-source/package-lock.json "$target/package-lock.json"; fi
          if [ -f apple-source/README.md ]; then cp apple-source/README.md "$target/README.md"; fi

      - name: Commit imported foundation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/agricultural-intelligence/apple
          git diff --cached --quiet && exit 0
          git commit -m "feat: import Apple intelligence foundation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
