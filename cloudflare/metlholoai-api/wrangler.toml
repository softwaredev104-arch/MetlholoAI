name = "metlholoai-api"
main = "src/index.js"
compatibility_date = "2026-09-29"
workers_dev = true

[vars]
ENVIRONMENT = "production"

[observability]
enabled = true

[[containers]]
class_name = "MetlholoAIModelRuntime"
image = "../../Dockerfile"
image_build_context = "../../"
max_instances = 2
[containers.instance_type]
vcpu = 1
memory_mib = 2048
disk_mb = 4000

  [containers.constraints]
  regions = ["AFR"]

[[durable_objects.bindings]]
name = "MODEL_RUNTIME"
class_name = "MetlholoAIModelRuntime"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetlholoAIModelRuntime"]
